<!DOCTYPE html>
<html lang="en">
<head>
    <title>Title</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg>
    <g>
        <!-- A rect with no attributes is not visible -->
        <!-- TODO Here -->
        <rect/>

        <!-- A rect with only x is not visible -->
        <!-- TODO Here -->
        <rect x="100"/>

        <!-- A rect with x and y is not visible -->
        <!-- TODO Here -->
        <rect x="100" y="100"/>

        <!-- A rect with x + y + width is not visible -->
        <!-- TODO Here -->
        <rect x="100" y="100" width="50"/>

        <!-- A rect with width and height is visible -->
        <!-- TODO Here -->
        <rect width="50" height="50"/>

        <!-- A rect with x, y, width and height is visible -->
        <!-- TODO Here -->
        <rect x="100" y="100" width="50" height="50"/>

        <!-- A rect with x+y+width+height + fill  -->
        <!-- TODO Here -->
        <rect x="200" y="100" width="50" height="50" fill="red"/>

        <!-- A rect with x+y+width+height + fill + stroke  -->
        <!-- TODO Here -->
        <rect x="300" y="100" width="50" height="50" fill="red" stroke="black"/>

        <!-- A rect with x+y+width+height + fill + stroke + stroke-width  -->
        <!-- TODO Here -->
        <rect x="400" y="100" width="50" height="50" fill="red" stroke="black" stroke-width="5"/>

        <!-- A rect with x+y+width+height + (((fill=none))) + stroke + stroke-width -->
        <!-- TODO Here -->
        <rect x="500" y="100" width="50" height="50" fill=none stroke="black" stroke-width="5"/>

        <!-- A rect with x+y+width+height + fill + stroke + stroke-width + opacity -->
        <!-- TODO Here -->
        <rect x="100" y="200" width="50" height="50" fill="red" stroke="black" stroke-width="5" opacity="0.5"/>

        <!-- A rect with x+y+width+height + fill + stroke + stroke-width + opacity + transform(translate) -->
        <rect x="200" y="200" width="50" height="50" fill="red" stroke="black" stroke-width="5" opacity="0.5" transform="translate(30,20)"/>
        <!-- TODO Here -->

        <!-- A rect with x+y+width+height + fill + stroke + stroke-width + rx + ry-->
        <!-- TODO Here -->
        <rect x="300" y="200" width="50" height="50" fill="red" stroke="black" stroke-width="5" rx="10" ry="10"/>

        <!-- A rect with x+y+width+height + fill + stroke + stroke-width +  stroke-dasharray-->
        <!-- TODO Here -->
        <rect x="400" y="200" width="50" height="50" fill="red" stroke="black" stroke-width="5" stroke-dasharray="10"/>
    </g>
</svg>
</body>
</html>
