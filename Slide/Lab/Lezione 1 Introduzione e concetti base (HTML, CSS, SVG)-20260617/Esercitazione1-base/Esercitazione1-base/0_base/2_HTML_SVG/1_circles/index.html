<!DOCTYPE html>
<html lang="en">
<head>
    <title>Title</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg>
    <g>
        <!--    <g transform="translate(100, 100)"> &lt;!&ndash; I can translate by (dx,dy) the transform of all the components in the group &ndash;&gt;-->

        <!-- A circle with no attributes is not visible -->
        <!-- TODO Here -->
        <circle/>

        <!-- The center-x value alone is not sufficient -->
        <!-- TODO Here -->
        <circle cx="100"/>

        <!-- The center-x and center-y values are not sufficient, we need the radius -->
        <!-- TODO Here -->
        <circle cx="100" cy="100"/>

        <!-- The radius alone is sufficient, because the default center-x and center-y values are 0 -->
        <!-- TODO Here -->
        <circle r="50"/>

        <!-- Circle with radius + cx + cy -->
        <!-- TODO Here -->
        <circle cx="100" cy="100" r="50"/>

        <!-- Circle with radius + cx + cy + fill=red -->
        <!-- TODO Here -->
        <circle cx="200" cy="100" r="50" fill="red"/>

        <!-- Circle with radius + cx + cy + fill + stroke=black -->
        <!-- TODO Here -->
        <circle cx="300" cy="100" r="50" fill="red" stroke="black"/>

        <!-- Circle with radius + cx + cy + fill + stroke + stroke-width -->
        <!-- TODO Here -->
        <circle cx="400" cy="100" r="50" fill="red" stroke="black" stroke-width="5"/>

        <!-- Circle with radius + cx + cy + fill + stroke + stroke-width + opacity -->
        <!-- TODO Here -->
        <circle cx="500" cy="100" r="50" fill="red" stroke="black" stroke-width="5" opacity="0.5"/>

        <!-- Circle with radius + cx + cy + fill + stroke + stroke-width + opacity + transform(translate(20,20)) -->
        <!-- TODO Here -->
        <circle cx="100" cy="200" r="50" fill="red" stroke="black" stroke-width="5" opacity="0.5" transform="(translate(20,20))"/>

        <!-- Circle with radius + cx + cy + (((fill=none))) + stroke + stroke-width -->
        <!-- TODO Here -->
        <circle cx="200" cy="200" r="50" fill=none stroke="black" stroke-width="5"/>

        <!-- Circle with radius + cx + cy + fill=none + stroke + stroke-width + stroke-dasharray -->
        <!-- TODO Here -->
        <circle cx="300" cy="200" r="50" fill=none stroke="black" stroke-width="5" stroke-dasharray="10"/>
    </g>
</svg>
</body>
</html>
