<!DOCTYPE html>
<html lang="en">
<head>
    <title>Title</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg>
    <g>
        <!-- line: you need two points <x1, y1> and <x2, y2> + stroke -->
        <!-- TODO Here -->
        <line x1="10" y1="10" x2="50" y2="10" stroke="black"/>

        <!-- if the coordinates are not specified, 0 is assumed -->
        <!-- TODO Here: only <x1, y1> + stroke=red) -->
        <line x1="10" y1="10" stroke="red"/>
        <!-- TODO Here: only <x1, y1, x2> + stroke=blue) -->
        <line x1="10" y1="10" x2="50" stroke="blue"/>

        <!-- line with stroke-width -->
        <!-- TODO Here: <x1, y1, x2, y2> + stroke=black + stroke-width) -->
        <line x1="10" y1="20" x2="50" y2="20" stroke="black" stroke-width="5"/>

        <!-- line with stroke-width + stroke-dasharray -->
        <!-- TODO Here: <x1, y1, x2, y2> + stroke=black + stroke-width + stroke-dasharray) -->
        <line x1="10" y1="30" x2="50" y2="30" stroke="black" stroke-width="5" stroke-dasharray="5"/>

        <!-- line with opacity -->
        <!-- TODO Here: <x1, y1, x2, y2> + stroke=red + stroke-width + opacity) -->
        <line x1="10" y1="40" x2="50" y2="40" stroke="black" stroke-width="5" opacity="0.5"/>
    </g>
</svg>
</body>
</html>
